l_english:
 ros.10.title: "The Settlement of Macedonia"
 ros.10.desc: "Our authority over Macedonia must take a lasting form. Royal officials demand money and political support. Entrusting the region to its magnates costs less today, but gives them privileges the next ruler will inherit."
 ros.11.title: "The Settlement of Albania"
 ros.11.desc: "Our authority over Albania must take a lasting form. Royal officials demand money and political support. Entrusting the region to its magnates costs less today, but gives them privileges the next ruler will inherit."
 ros.12.title: "The Settlement of Epirus and Acarnania"
 ros.12.desc: "Our authority over Epirus and Acarnania must take a lasting form. Royal officials demand money and political support. Entrusting the region to its magnates costs less today, but gives them privileges the next ruler will inherit."
 ros.13.title: "The Settlement of Thessaly"
 ros.13.desc: "Our authority over Thessaly must take a lasting form. Royal officials demand money and political support. Entrusting the region to its magnates costs less today, but gives them privileges the next ruler will inherit."
 ros_claim_programme: "Proclaim the Conquest Programme"
 ros_claim_programme_desc: "Hear Dušan’s existing ambitions event, expanded with Albania and Epirus. Grants twenty-year province conquest opportunities, not cores or automatic wars. Province-level peace demands can extend beyond our historical objectives."
 ros_proclaim_empire: "Convene the Imperial Coronation"
 ros_proclaim_empire_desc: "Open the existing imperial proclamation and patriarchate event. Requires Skopje and the Macedonian objective, not Thessaloniki or the later conquests. This is a one-time political decision."
 ros_promulgate_code: "Deliberate on the Imperial Code"
 ros_promulgate_code_desc: "Open the existing Code event, preserving its policy, financial cost, and estate opposition. You can consider this settlement once during the two situations."
 ros_prepare_successor: "Secure Recognition of the Heir"
 ros_prepare_successor_desc: "Pay for court assemblies recognizing the current heir. Reduces succession strain by 15 while that heir remains designated, and after succession only if that person actually inherits. This is preparation, not a forced succession."
 ros_settle_macedonia: "Settle Macedonia"
 ros_settle_macedonia_desc: "Choose royal administration or a privileged regional governorship. Requires the complete regional objective, including territory held by non-sovereign subjects. Each region can be settled once."
 ros_revoke_macedonia: "Reform the Governorship of Macedonia"
 ros_revoke_macedonia_desc: "Replace the regional delegation with royal administration. Costs six months of income and government power, angers the nobility, and removes the associated tax concession and succession burden."
 ros_settle_albania: "Settle Albania"
 ros_settle_albania_desc: "Choose royal administration or a privileged regional governorship. Requires the complete regional objective, including territory held by non-sovereign subjects. Each region can be settled once."
 ros_revoke_albania: "Reform the Governorship of Albania"
 ros_revoke_albania_desc: "Replace the regional delegation with royal administration. Costs six months of income and government power, angers the nobility, and removes the associated tax concession and succession burden."
 ros_settle_epirus: "Settle Epirus and Acarnania"
 ros_settle_epirus_desc: "Choose royal administration or a privileged regional governorship. Requires the complete regional objective, including territory held by non-sovereign subjects. Each region can be settled once."
 ros_revoke_epirus: "Reform the Governorship of Epirus and Acarnania"
 ros_revoke_epirus_desc: "Replace the regional delegation with royal administration. Costs six months of income and government power, angers the nobility, and removes the associated tax concession and succession burden."
 ros_settle_thessaly: "Settle Thessaly"
 ros_settle_thessaly_desc: "Choose royal administration or a privileged regional governorship. Requires the complete regional objective, including territory held by non-sovereign subjects. Each region can be settled once."
 ros_revoke_thessaly: "Reform the Governorship of Thessaly"
 ros_revoke_thessaly_desc: "Replace the regional delegation with royal administration. Costs six months of income and government power, angers the nobility, and removes the associated tax concession and succession burden."
 ros_negotiate_compact: "Negotiate the Imperial Compact"
 ros_negotiate_compact_desc: "Recognize regional privileges in exchange for a common political settlement. Reduces succession strain by 15 but adds a lasting tax concession. The compact and a centralized settlement are alternative paths."
 ros_confirm_crown: "Confirm the Consolidated Empire"
 ros_confirm_crown_desc: "Conclude the inheritance with an imperial crown, the Code in force, no delegated governorships or compact, and 36 consecutive settled months. Requires strain at 25 or less."
 ros_confirm_compact: "Ratify the Enduring Compact"
 ros_confirm_compact_desc: "Conclude the inheritance with an imperial crown, a negotiated compact, and 36 consecutive settled months. Regional concessions remain in force. Requires strain at 40 or less."

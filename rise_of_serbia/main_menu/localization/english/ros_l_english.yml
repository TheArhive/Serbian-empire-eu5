 ros_macedonia_heading: "Macedonia"
 ros_albania_heading: "Albania"
 ros_epirus_heading: "Epirus and Acarnania"
 ros_thessaly_heading: "Thessaly"
 ros_rise: "The Rise of Serbia"
 ros_rise_desc: "Conquer and settle the southern territories, proclaim the empire, and prepare a political inheritance that can survive its founder."
 ros_inheritance: "The Emperor’s Inheritance"
 ros_inheritance_desc: "Resolve the obligations left by Dušan and establish a lasting imperial settlement. The crisis follows the actual succession, not a fixed historical death date."
 ros_rise_intro: "Pursue four regional objectives at your own pace. Coronation does not require all four. Each conquest needs a political settlement; delegated privileges survive the ruler who granted them. Cards can be collapsed. Figures refresh monthly and after situation actions."
 ros_inheritance_intro: "Build 36 consecutive settled months, then confirm a consolidated empire or ratify a compact using the actions below. Peace, stability of at least 20, legitimacy of at least 60, strain no higher than 40, and settlement of every fully held objective are required for that count to advance. Unresolved inheritance ends after 20 years."
 ros_realm_heading: "State of the Realm"
 ros_realm_summary: "Regional objectives held: [Country.MakeScope.GetVariable('ros_conquests').GetValue|0]/4\nPrivileged governorships: [Country.MakeScope.GetVariable('ros_delegations').GetValue|0]\nHeld objectives awaiting settlement: [Country.MakeScope.GetVariable('ros_unsettled').GetValue|0]\nSuccession strain: [Country.MakeScope.GetVariable('ros_strain').GetValue|0]/100\n\nStrain starts at 40. Each delegation and each unsettled held objective adds 8. The Code subtracts 10; a recognized successor subtracts 15; the compact subtracts 15. Low stability, low legitimacy, low home-region control, and war each add 10. Lower strain is better.\nStability of at least 50 and legitimacy of at least 80 each subtract 5. Strain is clamped between 0 and 100."
 ros_foundations_heading: "Foundations of Empire"
 ros_foundations_summary: "[Country.Custom('ros_crown_status')]\n\n[Country.Custom('ros_code_status')]\n\n[Country.Custom('ros_heir_status')]"
 ros_inheritance_heading: "The Inheritance Ledger"
 ros_inheritance_summary: "[Country.Custom('ros_compact_status')]\n\nEvery privileged governorship is recorded in its regional card and country modifier. These are fiscal and political commitments, not new independent countries. The successor can reform them at a cost.\n\nThe centralized ending requires imperial rank, the Code, no delegations or compact, strain at most 25, and 36 consecutive settled months. The compact ending requires imperial rank, the compact, strain at most 40, and the same settled period. All four conquest objectives are optional for either ending."
 ros_rise_handover: "The Founder’s Inheritance"
 ros_rise_handover_desc: "Dušan is no longer Serbia’s reigning monarch. The successor inherits the real political settlements left behind."
 ros_country_lost: "Serbia Has Fallen"
 ros_central_victory: "The Consolidated Empire"
 ros_central_victory_desc: "A lasting imperial settlement under royal administration. Confirm it through the situation action after meeting the conditions displayed in the inheritance ledger."
 ros_compact_victory: "The Enduring Imperial Compact"
 ros_compact_victory_desc: "A lasting imperial settlement founded on negotiated privileges. Ratify it through the situation action; concessions remain in force."
 ros_unsettled_end: "An Unsettled Inheritance"
 ros_unsettled_end_desc: "Twenty years have passed without a lasting imperial settlement. Existing borders remain, but unresolved authority damages legitimacy for fifteen years."
 ros_map_held: "Direct Serbian possessions"
 ros_map_objectives: "Remaining regional objectives, including subject-held territory"
 ros_settle_royal: "Establish royal administration."
 ros_settle_delegated: "Entrust the region to its magnates."
 ros_royal_settlement_tt: "Settle this objective without a hereditary political concession. The administrative investment is represented by its immediate financial and political costs."
 ros_delegated_settlement_tt: "Settle this objective with a privileged governorship. Adds 8 succession strain and a lasting 2.5% tax-efficiency penalty. The successor may reform it."
 ros.1.title: "An Empire in the Making"
 ros.1.desc: "Dušan’s ambitions reach beyond the kingdom’s present frontiers. Conquest will require allies and administrators, and every concession made today will become part of tomorrow’s inheritance. Open The Rise of Serbia in the Situations view to pursue conquests, convene the coronation, deliberate on the Code, and prepare the succession."
 ros.1.a: "Let us build something that will endure."
 ros.2.title: "The Founder’s Shadow"
 ros.2.desc: "Dušan no longer rules Serbia. The new court inherits his territories, laws, and promises to the magnates. A successor recognized before the transition begins with firmer footing; an unprepared succession costs 10 legitimacy and 10 stability. Open The Emperor’s Inheritance to negotiate a lasting settlement."
 ros.2.a: "The realm must outlive its founder."
 ros.40.title: "A Crown That Endures"
 ros.40.desc: "The imperial Code and royal administration have survived the transfer of power. The empire’s authority now rests on institutions that have endured beyond their founder."
 ros.40.a: "The empire stands."
 ros.41.title: "The Imperial Compact"
 ros.41.desc: "The crown and its regional lords have established a settlement that can endure beyond the founder. Their concessions remain a real cost, but negotiated authority has preserved the imperial project."
 ros.41.a: "Let every lord keep faith with the crown."
 ros.42.title: "The Unfinished Inheritance"
 ros.42.desc: "Two decades have passed without a durable imperial settlement. The state survives, but contested authority continues to weaken the crown. Regional privileges remain in force; no territory is removed by this event."
 ros.42.a: "We must govern the realm we have."
 ros_compact_concessions: "Concessions of the Imperial Compact"
 ros_compact_concessions_desc: "Regional rights acknowledged in exchange for a common imperial settlement."
 ros_enduring_crown: "The Enduring Imperial Crown"
 ros_enduring_crown_desc: "Royal administration and imperial law have survived the founding emperor."
 ros_enduring_compact: "The Enduring Imperial Compact"
 ros_enduring_compact_desc: "The crown has secured a durable agreement with the regional lords."
 ros_unfinished_inheritance: "The Unfinished Inheritance"
 ros_unfinished_inheritance_desc: "The founding emperor’s political inheritance remains unresolved."
 ros_inheritance_counters: "Months since succession: [Country.MakeScope.GetVariable('ros_inheritance_months').GetValue|0]/240\nConsecutive settled months: [Country.MakeScope.GetVariable('ros_stable_months').GetValue|0]/36"
 granted_claims_stefan_uros_tt: "Conquest opportunities cover Macedonia, Thessaly, Albania, and Epirus. Durrës and Thessaloniki are not historical objectives. Province conquest casus belli do not restrict the eventual peace treaty to historical borders."
 ser_conquest_into_empire: "Gain twenty-year conquest opportunities in the Macedonian and Thessalian provinces listed below."
 flavor_ser.31.desc: "The conquests in Macedonia have given our court the standing to proclaim an empire. An assembly at Skopje can recognize the imperial title and elevate our ecclesiastical authority. Albania, Epirus, and Thessaly remain opportunities for expansion; neither Thessaloniki nor Constantinople must fall before the imperial proclamation."
